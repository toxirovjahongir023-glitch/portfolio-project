<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <main>
        <section>
            <div class="maps container">
                <div>
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d5994.47171409296!2d69.24390088147574!3d41.30373241165988!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x38ae8bf3870c714d%3A0x6ddece20c220333b!2sMagic%20City%20Park!5e0!3m2!1sen!2s!4v1791374224256!5m2!1sen!2s"
                        width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="strict-origin-when-cross-origin"></iframe>
                </div>

                <div>
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!4v1791374314571!6m8!1m7!1sCAoSFkNJSE0wb2dLRUlDQWdJREJ4N0xsYWc.!2m2!1d41.30382913664414!2d69.24488256717062!3f146.04689784522398!4f0!5f0.7820865974627469"
                        width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="strict-origin-when-cross-origin"></iframe>
                </div>
            </div>

            <div class="iframe">
                <img-comparison-slider>
                    <img class="img1" slot="first"
                        src="./image.png" />
                    <img class="img2" slot="second"
                        src="./image copy.png" />
                </img-comparison-slider>
            </div>
        </section>
    </main>

    <script src="https://unpkg.com/img-comparison-slider@8/dist/index.js"></script>

</body>

</html>
