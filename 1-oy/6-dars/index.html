<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6-dars</title>
</head>

<body>
    <h1>Formlar,Inputlar va Label bilan ishlash</h1>
    <form>
        <label for="name">Ismingiz:</label>
        <br>
        <input id="name" type="text" placeholder="Enter your name">
        <br>
        <br>
        <label for="password">Parol:</label>
        <br>
        <input id="password" type="password" placeholder="Enter your password ">
        <br>
        <br>
        <label for="email">Emailingizni kiriting</label>
        <br>
        <input id="email" type="email" placeholder="Enter your email">
        <br>
        <br>
        <input id="check" type="checkbox">
        <label for="check">Rozimisiz?</label>
        <br>
        <br>
        <input name="gender" id="Erkak" type="radio">
        <label for="Erkak">Erkak</label>
        <br>
        <input name="gender" id="ayol" type="radio">
        <label for="ayol">Ayol</label>
        <br>
        <br>
        <select name="" id="">
            <option value="">Toshkent</option>
            <option value="">Samarqand</option>
            <option value="">Buhoro</option>
            <option value="">Andijon</option>
        </select>
        <br>
        <br>
        <textarea rows="" cols="25" name="" id="" placeholder="Enter your comment "></textarea>
        <br>

        <button>Send</button>
    </form>
<hr>

            </tr>

    </table>
</body>
