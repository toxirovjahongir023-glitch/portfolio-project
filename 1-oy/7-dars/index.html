<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-dars uy ishi</title>
</head>

<body>
    <h1><em>Uy ishi</em></h1>
    <h2>Narxlar</h2>
    <form>
        <caption>Ro'yxatdan otish</caption>
        <label aria-label="Ismingizni kiriting" for="name">Ismingizni kiriting</label>
        <br>
        <input type="text" id="name" placeholder="enter your name">
        <br>
        <br>
        <label aria-label="familyangizni kiriting" for="surname">Familyangizni kiriting</label>
        <br>
        <input type="text" id="surname" placeholder="enter your surname">
        <br>
        <br>
        <label aria-label="emailingizni kiriting" for="email">Emailingizni krirting</label>
        <br>
        <input type="email" id="email" placeholder="enter your email">
        <br>
        <br>
        <label aria-label="yoshingizni kiriting" for="age">Yoshingizni kiriting</label>
        <br>
        <input type="text" id="age" placeholder="enter your age">
        <br>
        <br>
        <label aria-label="viloyatingizni tanlang" for="region">Viloyatingizni tanlang</label>
        <select name="" id="region">
            <option aria-label="Andijon" value="">Andijon</option>
            <option aria-label="Buxoro" value="">Buxoro</option>
            <option aria-label="Fargʻona" value="">Fargʻona</option>
            <option aria-label="Jizzax" value="">Jizzax</option>
            <option aria-label="Xorazm" value="">Xorazm</option>
            <option aria-label="Namangan" value="">Namangan</option>
            <option aria-label="Navoiy" value="">Navoiy</option>
            <option aria-label="Qashqadaryo" value="">Qashqadaryo</option>
            <option aria-label="Samarqand" value="">Samarqand</option>
            <option aria-label="Sirdaryo" value="">Sirdaryo</option>
            <option aria-label="Surxondaryo" value="">Surxondaryo</option>
            <option aria-label="Toshkent" value="">Toshkent</option>
        </select>
        <br>
        <br>
        <h2 aria-label="Jinsingizni tanlang">Jinsingizni tanlang</h2>
        <input type="radio" name="gender" id="male">
        <label aria-label="Erkak" for="male">Erkak</label>
        <input type="radio" name="gender" id="female">
        <label aria-label="Ayol" for="female">Ayol</label>
        <br>
        <br>
        <input type="checkbox" id="agree">
        <label aria-label="Rozimisiz" for="agree">Rozimisiz?</label>
        <br>
        <br>
        <textarea aria-label="Sharhingizni kirting" name="" id="" cols="25" rows="10" placeholder="Enter your comment"></textarea>
        <br>
        <br>
        <button aria-label="Jo'natish">Jo'natish</button>
    </form>
    <hr>
    
</body>

</html>
